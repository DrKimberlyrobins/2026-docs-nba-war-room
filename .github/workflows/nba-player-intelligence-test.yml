
name: NBA Player Intelligence Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-player-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Collect ESPN NBA player intelligence
        shell: bash
        run: |
          cat > /tmp/nba_player_test.py <<'PY'
          import json
          import time
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone

          BASE = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba"
          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def fetch(url):
              request = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except Exception as error:
                  print("FETCH ERROR:", url, str(error))
                  return None

          def number(value):
              try:
                  return float(str(value).replace(",", ""))
              except (ValueError, TypeError):
                  return 0.0

          def parse_stats(labels, values):
              raw = dict(zip(labels, values))
              result = {}
              for key, label in [
                  ("points", "PTS"),
                  ("rebounds", "REB"),
                  ("assists", "AST"),
                  ("threes", "3PT"),
                  ("minutes", "MIN")
              ]:
                  value = raw.get(label, "0")
                  if key == "threes":
                      value = str(value).split("-")[0]
                  if key == "minutes" and ":" in str(value):
                      parts = str(value).split(":")
                      value = number(parts[0]) + number(parts[1]) / 60
                  result[key] = number(value)
              return result

          def averages(games):
              if not games:
                  return None
              fields = ["points", "rebounds", "assists", "threes", "minutes"]
              return {
                  key: round(sum(g[key] for g in games) / len(games), 2)
                  for key in fields
              }

          # Discover recent completed NBA games, including preseason.
          today = datetime.now(timezone.utc).date()
          dates = [
              (today - timedelta(days=offset)).strftime("%Y%m%d")
              for offset in range(0, 21)
          ]

          discovered = {}
          for date in dates:
              data = fetch(f"{BASE}/scoreboard?dates={date}&limit=100")
              if not data:
                  continue
              for event in data.get("events", []):
                  if event.get("status", {}).get("type", {}).get("completed"):
                      discovered[event["id"]] = {
                          "date": event.get("date"),
                          "name": event.get("name")
                      }
              time.sleep(0.15)

          print("COMPLETED GAMES DISCOVERED:", len(discovered))

          # Limit this first test to avoid unnecessary API traffic.
          selected = sorted(
              discovered.items(),
              key=lambda item: item[1]["date"] or "",
              reverse=True
          )[:20]

          players = defaultdict(list)
          failures = []
          processed = 0

          for event_id, event_info in selected:
              data = fetch(f"{BASE}/summary?event={event_id}")
              if not data:
                  failures.append(event_id)
                  continue

              box = data.get("boxscore", {})
              teams = box.get("players", [])
              found = 0

              for team in teams:
                  team_name = team.get("team", {}).get("displayName", "")
                  for group in team.get("statistics", []):
                      labels = group.get("labels", [])
                      for athlete in group.get("athletes", []):
                          if athlete.get("didNotPlay"):
                              continue
                          athlete_info = athlete.get("athlete", {})
                          athlete_id = str(athlete_info.get("id", ""))
                          if not athlete_id:
                              continue
                          stats = parse_stats(labels, athlete.get("stats", []))
                          if not athlete.get("stats"):
                              continue
                          players[athlete_id].append({
                              "date": event_info["date"],
                              "eventId": event_id,
                              "player": athlete_info.get("displayName", ""),
                              "team": team_name,
                              **stats
                          })
                          found += 1

              if found == 0:
                  failures.append(event_id)
              else:
                  processed += 1

              time.sleep(0.2)

          report = []
          for athlete_id, games in players.items():
              games.sort(key=lambda game: game["date"] or "", reverse=True)
              report.append({
                  "playerId": athlete_id,
                  "name": games[0]["player"],
                  "team": games[0]["team"],
                  "gamesFound": len(games),
                  "last5": averages(games[:5]),
                  "last10": averages(games[:10]),
                  "gameLogs": games
              })

          report.sort(key=lambda player: player["name"])

          result = {
              "test": "NBA Player Intelligence",
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "completedGamesDiscovered": len(discovered),
              "gamesProcessed": processed,
              "uniquePlayers": len(report),
              "playerGameRecords": sum(p["gamesFound"] for p in report),
              "failedEvents": failures,
              "players": report
          }

          with open("nba-player-intelligence-test.json", "w") as file:
              json.dump(result, file, indent=2)

          print("\n===== NBA PLAYER INTELLIGENCE =====")
          print("Games processed:", processed)
          print("Unique players:", len(report))
          print("Player-game records:", result["playerGameRecords"])
          print("Failed events:", len(failures))

          for player in report[:5]:
              print(
                  player["name"],
                  "| games:", player["gamesFound"],
                  "| last5:", player["last5"]
              )

          if processed == 0 or not report:
              raise SystemExit("TEST FAILED: No usable player records")

          print("\nTEST COMPLETE: Review sample sizes before using averages.")
          PY

          python /tmp/nba_player_test.py

      - name: Save player intelligence test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-player-intelligence-test
          path: nba-player-intelligence-test.json
          if-no-files-found: warn
