
name: NBA Player History Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Collect and validate NBA player history
        shell: bash
        run: |
          cat > /tmp/nba_history.py <<'PY'
          import json
          import time
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone

          BASE = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba"
          HEADERS = {"User-Agent": "Mozilla/5.0"}
          SEASON = 2026
          # ESPN season 2026 = 2025-26 NBA season.
          MONTHS = {
              "regular": ["202510", "202511", "202512",
                          "202601", "202602", "202603", "202604"],
              "playoffs": ["202604", "202605", "202606"],
              "preseason": ["202510"]
          }
          TYPES = {"preseason": 1, "regular": 2, "playoffs": 3}
          MAX_GAMES_PER_TYPE = 35

          def fetch(url):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.load(r)
                  except Exception as e:
                      if attempt == 2:
                          print("FETCH FAILED:", str(e), url)
                      else:
                          time.sleep(attempt + 1)
              return None

          def num(v):
              try:
                  return float(v)
              except (ValueError, TypeError):
                  return None

          def parse(labels, values):
              if not values or len(labels) != len(values):
                  return None
              raw = dict(zip(labels, values))
              result = {}
              for key, label in [
                  ("points", "PTS"), ("rebounds", "REB"),
                  ("assists", "AST"), ("minutes", "MIN"),
                  ("threes", "3PT")
              ]:
                  value = raw.get(label)
                  if value is None:
                      return None
                  if key == "threes":
                      value = str(value).split("-")[0]
                  if key == "minutes" and ":" in str(value):
                      parts = str(value).split(":")
                      if len(parts) != 2:
                          return None
                      a, b = num(parts[0]), num(parts[1])
                      value = None if a is None or b is None else a + b / 60
                  else:
                      value = num(value)
                  if value is None:
                      return None
                  result[key] = value
              return result

          def avg(games):
              fields = ["points", "rebounds", "assists",
                        "threes", "minutes"]
              return {
                  key: round(sum(g[key] for g in games) / len(games), 2)
                  for key in fields
              } if games else None

          def window(games, count):
              return {
                  "requestedGames": count,
                  "availableGames": min(count, len(games)),
                  "complete": len(games) >= count,
                  "averages": avg(games[:count])
              }

          report = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "espnSeason": SEASON,
              "scope": "Historical sample test, not complete season coverage",
              "maxGamesPerType": MAX_GAMES_PER_TYPE,
              "seasonTypes": {}
          }

          for name, months in MONTHS.items():
              events = {}
              for month in months:
                  url = (f"{BASE}/scoreboard?dates={month}"
                         f"&season={SEASON}&seasontype={TYPES[name]}"
                         "&limit=200")
                  data = fetch(url)
                  if data is None:
                      raise SystemExit("Scoreboard request failed: " + month)

                  for event in data.get("events", []):
                      status = event.get("status", {}).get("type", {})
                      season_type = event.get("season", {}).get("type")
                      if not status.get("completed"):
                          continue
                      if season_type is not None:
                          if int(season_type) != TYPES[name]:
                              continue
                      events[str(event["id"])] = event
                  time.sleep(0.1)

              selected = sorted(
                  events.values(),
                  key=lambda e: e.get("date", ""),
                  reverse=True
              )[:MAX_GAMES_PER_TYPE]

              logs = defaultdict(list)
              failures = []
              processed = 0
              invalid_rows = 0

              for event in selected:
                  eid = str(event["id"])
                  data = fetch(f"{BASE}/summary?event={eid}")
                  if data is None:
                      failures.append(eid)
                      continue

                  count = 0
                  for team in data.get("boxscore", {}).get("players", []):
                      team_name = team.get("team", {}).get("displayName", "")
                      for group in team.get("statistics", []):
                          labels = group.get("labels", [])
                          for item in group.get("athletes", []):
                              if item.get("didNotPlay"):
                                  continue
                              athlete = item.get("athlete", {})
                              pid = str(athlete.get("id", ""))
                              stats = parse(labels, item.get("stats", []))
                              if not pid or stats is None:
                                  invalid_rows += 1
                                  continue
                              logs[pid].append({
                                  "eventId": eid,
                                  "date": event.get("date"),
                                  "name": athlete.get("displayName", ""),
                                  "team": team_name,
                                  **stats
                              })
                              count += 1

                  if count == 0:
                      failures.append(eid)
                  else:
                      processed += 1
                  time.sleep(0.12)

              players = []
              for pid, games in logs.items():
                  games.sort(key=lambda g: g["date"] or "",
                             reverse=True)
                  players.append({
                      "playerId": pid,
                      "name": games[0]["name"],
                      "team": games[0]["team"],
                      "sampleGames": len(games),
                      "last5": window(games, 5),
                      "last10": window(games, 10),
                      "sampleAverage": avg(games),
                      "gameLogs": games
                  })

              players.sort(key=lambda p: p["name"])
              section = {
                  "discoveredGames": len(events),
                  "selectedGames": len(selected),
                  "processedGames": processed,
                  "failedEvents": failures,
                  "invalidRows": invalid_rows,
                  "uniquePlayers": len(players),
                  "playerGameRecords": sum(
                      p["sampleGames"] for p in players
                  ),
                  "completeLast5": sum(
                      p["last5"]["complete"] for p in players
                  ),
                  "completeLast10": sum(
                      p["last10"]["complete"] for p in players
                  ),
                  "players": players
              }
              report["seasonTypes"][name] = section

              print(f"\n===== {name.upper()} =====")
              for key in [
                  "discoveredGames", "selectedGames",
                  "processedGames", "uniquePlayers",
                  "playerGameRecords", "completeLast5",
                  "completeLast10", "invalidRows"
              ]:
                  print(f"{key}: {section[key]}")
              print("failedEvents:", len(failures))

              if selected and processed == 0:
                  raise SystemExit("No usable games for " + name)

          with open("nba-player-history-test.json", "w") as f:
              json.dump(report, f, indent=2)

          total = sum(
              s["playerGameRecords"]
              for s in report["seasonTypes"].values()
          )
          print("\nTOTAL PLAYER-GAME RECORDS:", total)
          if total == 0:
              raise SystemExit("No player history collected")
          print("HISTORY TEST COMPLETE")
          print("NOTE: Last-5/10 windows are sampled, not")
          print("guaranteed to be true season-wide recent games.")
          PY

          python /tmp/nba_history.py

      - name: Upload history test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-player-history-test
          path: nba-player-history-test.json
          if-no-files-found: warn
