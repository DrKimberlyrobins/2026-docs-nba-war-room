name: Refresh verified NBA defensive matchups
on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * *'
permissions:
  contents: write
jobs:
  matchups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official stats client
        run: python -m pip install nba_api pandas
      - name: Fetch real NBA player-defender tracking records
        run: python scripts/refresh_defensive_matchups.py --season 2026-27
      - name: Commit verified dataset only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_defensive_matchups.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified NBA defensive matchups"
            git push
          fi
