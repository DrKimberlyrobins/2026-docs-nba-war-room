
name: NBA Connector Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-nba-connectors:
    runs-on: ubuntu-latest

    steps:
      - name: Test NBA API connections
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        shell: python
        run: |
          import os
          import json
          import urllib.request
          import urllib.error
          import urllib.parse

          def test_api(name, url, headers=None):
              print(f"\n===== {name} =====")
              request = urllib.request.Request(
                  url,
                  headers=headers or {}
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      payload = json.load(response)
                      data = payload.get("data", payload)

                      print("STATUS: CONNECTED")
                      print("HTTP:", response.status)

                      if isinstance(data, list):
                          print("RECORDS:", len(data))
                      else:
                          print("RESPONSE TYPE:", type(data).__name__)

                      return True

              except urllib.error.HTTPError as error:
                  print("STATUS: NOT AVAILABLE")
                  print("HTTP:", error.code)

                  if error.code == 401:
                      print("Check authentication or API key.")
                  elif error.code == 403:
                      print("Check subscription permissions.")
                  elif error.code == 429:
                      print("Rate limit or quota reached.")
                  else:
                      print("Check endpoint or plan access.")

              except Exception as error:
                  print("STATUS: CONNECTION ERROR")
                  print("ERROR TYPE:", type(error).__name__)

              return False

          bdl = os.environ.get("BALLDONTLIE_API_KEY", "")
          odds = os.environ.get("ODDS_API_KEY", "")

          results = {}

          if bdl:
              headers = {"Authorization": bdl}

              endpoints = {
                  "NBA Teams":
                      "https://api.balldontlie.io/v1/teams",
                  "NBA Games":
                      "https://api.balldontlie.io/v1/games?per_page=5",
                  "NBA Players":
                      "https://api.balldontlie.io/v1/players?per_page=5",
                  "NBA Player Stats":
                      "https://api.balldontlie.io/v1/stats?per_page=5",
                  "NBA Injuries":
                      "https://api.balldontlie.io/v1/player_injuries?per_page=5"
              }

              for name, url in endpoints.items():
                  results[name] = test_api(
                      name, url, headers
                  )
          else:
              print("BALLDONTLIE SECRET MISSING")

          if odds:
              params = urllib.parse.urlencode({
                  "apiKey": odds,
                  "regions": "us",
                  "markets": "h2h",
                  "oddsFormat": "american"
              })

              url = (
                  "https://api.the-odds-api.com/v4/sports/"
                  "basketball_nba/odds/?" + params
              )

              results["NBA Moneyline Odds"] = test_api(
                  "NBA Moneyline Odds", url
              )
          else:
              print("ODDS API SECRET MISSING")

          print("\n===== FINAL CONNECTOR REPORT =====")

          for name, connected in results.items():
              status = "GREEN" if connected else "CHECK"
              print(f"{status}: {name}")

          print("\nConnector test complete.")
          print("No API keys were printed.")
